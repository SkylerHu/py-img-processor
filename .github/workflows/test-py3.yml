name: unit testing

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: "3.9"
            pillow: 8
          - python: "3.10"
            pillow: 9
          - python: "3.12"
            pillow: 10
          - python: "3.9"
            pillow: 11
          - python: "3.12"
            pillow: 11
          - python: "3.12"
            pillow: 12

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install OpenCV system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-opencv

      - name: Install tox
        run: pip install tox

      - name: Run tox targets for Python ${{ matrix.python }} with Pillow ${{ matrix.pillow }}
        run: tox run -e py$(echo ${{ matrix.python }} | tr -d .)-pillow${{ matrix.pillow }}

      - name: Upload coverage to Codecov
        if: ${{ matrix.python == '3.12' && matrix.pillow == 10 }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
