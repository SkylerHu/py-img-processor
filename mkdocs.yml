site_name: Image Processing Library
site_url: ""
repo_url: https://github.com/skylerhu/py-img-processor
docs_dir: docs

hooks:
  - docs/hooks/rewrite_paths.py

theme:
  name: material
  logo: imgs/logo.svg
  favicon: imgs/favicon.ico
  palette:
    scheme: default
  features:
    - navigation.tabs
    - toc.integrate

extra:
  alternate:
    - name: English
      link: "."
      lang: en
    - name: 中文
      link: "zh/"
      lang: zh

nav:
  - Home: README.md
  - Reference: Reference.md
  - FAQ: FAQ.md
  - Changelog: CHANGELOG-1.x.md
  - Contributing: CONTRIBUTING.md

extra_css:
  - css/custom.css

extra_javascript:
  - js/lang-redirect.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: 参数化图像处理库
          nav_translations:
            Home: 首页
            Reference: 图像处理参数
            FAQ: 常见问题
            Changelog: 更新日志
            Contributing: 贡献者指南
